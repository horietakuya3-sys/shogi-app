<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2f22">
<title>将棋研究</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="coi.js"></script>
</head>
<body>
<header class="topbar">
  <button id="btnMenu" class="icon-btn" aria-label="メニュー">☰</button>
  <div class="evalbox">
    <div class="evaltext"><span id="evalValue">—</span><span id="evalSub"></span></div>
    <div class="evalbar"><div id="evalFill"></div></div>
  </div>
  <button id="btnEngine" class="toggle on" aria-label="解析のオンオフ">解析</button>
</header>

<main>
  <section id="candidates" class="candidates" aria-live="polite">
    <div class="cand-empty" id="candStatus">エンジンを準備しています…</div>
  </section>

  <div class="boardwrap">
    <div class="hand" id="handTop"></div>
    <div class="board-outer">
      <div class="files" id="filesLabel"></div>
      <div class="board-row">
        <div class="board-box">
          <div class="board" id="board"></div>
          <svg class="arrows" id="arrows" viewBox="0 0 9 9" preserveAspectRatio="none"></svg>
        </div>
        <div class="ranks" id="ranksLabel"></div>
      </div>
    </div>
    <div class="hand" id="handBottom"></div>
  </div>

  <div class="branchbar hidden" id="branchBar">
    <span>変化を検討中</span>
    <button id="btnMainline">本譜に戻る</button>
  </div>

  <nav class="controls">
    <button id="btnFirst" aria-label="最初へ">⏮</button>
    <button id="btnPrev" aria-label="1手戻る">◀</button>
    <div class="plyinfo" id="plyInfo">開始局面</div>
    <button id="btnNext" aria-label="1手進む">▶</button>
    <button id="btnLast" aria-label="最後へ">⏭</button>
  </nav>

  <div class="comment hidden" id="comment"></div>

  <section class="movelist" id="moveList"></section>
</main>

<div class="sheet hidden" id="menuSheet">
  <div class="sheet-inner">
    <button data-act="openFile">棋譜ファイルを読み込む</button>
    <button data-act="paste">棋譜を貼り付けて読み込む</button>
    <button data-act="saveKif">KIFファイルで保存</button>
    <button data-act="copyKif">KIFをコピー</button>
    <button data-act="flip">盤を反転</button>
    <div class="row">
      <span>候補手の数</span>
      <select id="selMultiPV">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    <button data-act="newGame">新しい盤（平手）</button>
    <button data-act="close" class="sub">閉じる</button>
  </div>
</div>

<div class="sheet hidden" id="pasteSheet">
  <div class="sheet-inner">
    <textarea id="pasteText" rows="10" placeholder="KIF・KI2・SFENのどれかを貼り付け"></textarea>
    <button id="btnPasteLoad">読み込む</button>
    <button id="btnPasteCancel" class="sub">やめる</button>
  </div>
</div>

<div class="sheet hidden" id="promoSheet">
  <div class="sheet-inner promo">
    <div>成りますか？</div>
    <div class="promo-btns">
      <button id="btnPromoYes">成る</button>
      <button id="btnPromoNo">成らない</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<input type="file" id="fileInput" accept=".kif,.kifu,.ki2,.ki2u,.txt,.sfen,text/plain" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
