<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2f22">
<title>将棋研究</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script src="coi.js"></script>
</head>
<body>
<header class="topbar">
  <button id="btnMenu" class="icon-btn" aria-label="メニュー">☰</button>
  <div class="evalbox">
    <div class="evaltext"><span id="evalValue">—</span><span id="evalSub"></span></div>
    <div class="evalbar"><div id="evalFill"></div></div>
  </div>
  <button id="btnEngine" class="toggle on" aria-label="解析のオンオフ">解析</button>
</header>

<main>
  <section id="candidates" class="candidates" aria-live="polite">
    <div class="cand-empty" id="candStatus">エンジンを準備しています…</div>
  </section>

  <div class="boardwrap">
    <div class="hand" id="handTop"></div>
    <div class="board-outer">
      <div class="files" id="filesLabel"></div>
      <div class="board-row">
        <div class="board-box">
          <div class="board" id="board"></div>
          <svg class="arrows" id="arrows" viewBox="0 0 9 9" preserveAspectRatio="none"></svg>
        </div>
        <div class="ranks" id="ranksLabel"></div>
      </div>
    </div>
    <div class="hand" id="handBottom"></div>
  </div>

  <div class="playbar hidden" id="playBar">
    <span id="playInfo">対局中</span>
    <div class="playbtns">
      <button id="btnUndo">待った</button>
      <button id="btnResign">投了</button>
      <button id="btnAbort" class="sub">中断</button>
    </div>
  </div>

  <div class="playbar practice hidden" id="practiceBar">
    <span id="practiceInfo">復習</span>
    <div class="playbtns">
      <button id="btnPracticeShow">答えを見る</button>
      <button id="btnPracticeNext" class="hidden">次の問題</button>
      <button id="btnPracticeEnd" class="sub">終了</button>
    </div>
  </div>

  <div class="branchbar hidden" id="branchBar">
    <span>変化を検討中</span>
    <button id="btnMainline">本譜に戻る</button>
  </div>

  <nav class="controls">
    <button id="btnFirst" aria-label="最初へ">⏮</button>
    <button id="btnPrev" aria-label="1手戻る">◀</button>
    <div class="plyinfo" id="plyInfo">開始局面</div>
    <button id="btnNext" aria-label="1手進む">▶</button>
    <button id="btnLast" aria-label="最後へ">⏭</button>
  </nav>

  <div class="comment hidden" id="comment"></div>

  <section class="review hidden" id="reviewPanel">
    <div class="review-head">
      <span id="reviewStatus">局後解析</span>
      <select id="selReviewSide" aria-label="復習する側">
        <option value="0">先手の手</option>
        <option value="1">後手の手</option>
        <option value="both">両方</option>
      </select>
      <div class="review-btns">
        <button id="btnPrevBad">◀悪手</button>
        <button id="btnNextBad">悪手▶</button>
        <button id="btnReviewStop" class="hidden">中止</button>
      </div>
    </div>
    <div class="progress hidden" id="reviewProgress"><div id="reviewProgressFill"></div></div>
    <svg class="graph" id="graph" preserveAspectRatio="none"></svg>
    <div class="review-move" id="reviewMove"></div>
    <div class="review-sum" id="reviewSum"></div>
  </section>

  <section class="movelist" id="moveList"></section>
</main>

<div class="sheet hidden" id="menuSheet">
  <div class="sheet-inner">
    <button data-act="play" class="primary">対局を始める</button>
    <button data-act="review">局後解析（この棋譜を解析）</button>
    <button data-act="practice">復習（悪手を指した局面のやり直し）</button>
    <button data-act="profile">プロフィール・戦績</button>
    <button data-act="openFile">棋譜ファイルを読み込む</button>
    <button data-act="paste">棋譜を貼り付けて読み込む</button>
    <button data-act="saveKif">KIFファイルで保存</button>
    <button data-act="copyKif">KIFをコピー</button>
    <button data-act="flip">盤を反転</button>
    <div class="row">
      <span>候補手の数</span>
      <select id="selMultiPV">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    <div class="row">
      <span>局後解析の精度</span>
      <select id="selReviewDepth">
        <option value="fast">速い（1手0.3秒）</option>
        <option value="normal" selected>標準（1手1秒）</option>
        <option value="deep">詳しく（1手3秒）</option>
      </select>
    </div>
    <label class="row check"><span>駒音</span><input type="checkbox" id="chkSound" checked></label>
    <button data-act="newGame">新しい盤（平手）</button>
    <button data-act="close" class="sub">閉じる</button>
  </div>
</div>

<div class="sheet hidden" id="playSheet">
  <div class="sheet-inner form">
    <div class="sheet-title">対局の設定</div>
    <div class="side-cfg" data-side="0">
      <div class="side-name">☗ 先手</div>
      <select class="p-type"><option value="human">人</option><option value="ai">AI</option></select>
      <select class="p-level"></select>
      <select class="p-strategy"></select>
    </div>
    <div class="side-cfg" data-side="1">
      <div class="side-name">☖ 後手</div>
      <select class="p-type"><option value="human">人</option><option value="ai" selected>AI</option></select>
      <select class="p-level"></select>
      <select class="p-strategy"></select>
    </div>
    <div class="row">
      <span>持ち時間</span>
      <select id="selMain">
        <option value="0">なし</option>
        <option value="180">3分</option>
        <option value="300">5分</option>
        <option value="600" selected>10分</option>
        <option value="900">15分</option>
        <option value="1800">30分</option>
        <option value="3600">60分</option>
      </select>
    </div>
    <div class="row">
      <span>秒読み</span>
      <select id="selByo">
        <option value="0">なし</option>
        <option value="10">10秒</option>
        <option value="30" selected>30秒</option>
        <option value="60">60秒</option>
      </select>
    </div>
    <label class="row check"><span>今の局面から始める</span><input type="checkbox" id="chkFromHere"></label>
    <button id="btnPlayStart" class="primary">対局開始</button>
    <button id="btnPlayCancel" class="sub">やめる</button>
  </div>
</div>

<div class="sheet center hidden" id="confirmSheet">
  <div class="sheet-inner confirm">
    <div class="sheet-title" id="confirmText">よろしいですか？</div>
    <div class="promo-btns">
      <button id="btnConfirmCancel" class="sub">やめる</button>
      <button id="btnConfirmOk" class="primary">はい</button>
    </div>
  </div>
</div>

<div class="sheet hidden" id="endSheet">
  <div class="sheet-inner">
    <div class="sheet-title" id="endText">終局</div>
    <button id="btnEndReview" class="primary">局後解析する</button>
    <button id="btnEndClose" class="sub">閉じる</button>
  </div>
</div>

<div class="sheet full hidden" id="profileSheet">
  <div class="sheet-inner">
    <div class="sheet-title">プロフィール・戦績</div>
    <div id="profileBody"></div>
    <button id="btnProfilePractice" class="primary">復習を始める</button>
    <div class="pf-io">
      <button id="btnExport">記録を書き出す</button>
      <button id="btnImport">記録を読み込む</button>
    </div>
    <button id="btnProfileClose" class="sub">閉じる</button>
  </div>
</div>

<div class="sheet hidden" id="pasteSheet">
  <div class="sheet-inner">
    <textarea id="pasteText" rows="10" placeholder="KIF・KI2・SFENのどれかを貼り付け"></textarea>
    <button id="btnPasteLoad">読み込む</button>
    <button id="btnPasteCancel" class="sub">やめる</button>
  </div>
</div>

<div class="sheet hidden" id="promoSheet">
  <div class="sheet-inner promo">
    <div>成りますか？</div>
    <div class="promo-btns">
      <button id="btnPromoYes">成る</button>
      <button id="btnPromoNo">成らない</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>
<input type="file" id="fileInput" accept=".kif,.kifu,.ki2,.ki2u,.txt,.sfen,text/plain" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
